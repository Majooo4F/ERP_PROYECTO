<div class="min-h-screen bg-gray-50 p-8">

  <!-- BIENVENIDA -->
  <div class="text-center mb-10">
    <h1 class="text-4xl font-bold text-black">
      Bienvenido <span class="text-blue-600 capitalize">{{ usuario }}</span>
    </h1>
    <p class="text-gray-700 mt-2 text-lg">
      Aquí puedes ver los grupos disponibles
    </p>
  </div>

  <!-- LOADING -->
  <div *ngIf="loading" class="flex justify-center items-center h-40">
    <i class="pi pi-spin pi-spinner text-4xl text-blue-500"></i>
  </div>

  <!-- SIN GRUPOS -->
  <div *ngIf="cargado && !loading && grupos.length === 0"
       class="text-center text-gray-500 mt-20">
    <i class="pi pi-inbox text-5xl mb-4 block"></i>
    <p class="text-lg">No hay grupos disponibles aún.</p>
  </div>

  <!-- GRUPOS -->
  <div *ngIf="cargado && !loading && grupos.length > 0"
       class="grid grid-cols-1 md:grid-cols-3 gap-6">

    <p-card
      *ngFor="let grupo of grupos; let i = index"
      class="cursor-pointer bg-white rounded-2xl shadow-md hover:shadow-xl hover:-translate-y-1 transition-all duration-300 border border-gray-200"
      (click)="entrarGrupo(grupo)"
      [style]="{
        'border-top': '6px solid ' + getColor(i),
        'background': '#ffffff'
      }"
    >
      <div class="flex flex-col gap-3">
        <h2 class="text-xl font-bold text-gray-900">
          {{ grupo.nombre }}
        </h2>
        <span class="text-gray-400 text-sm">Grupo</span>
        <div class="text-sm text-gray-600">
          {{ grupo.descripcion || 'Sin descripción' }}
        </div>
        <div class="mt-3">
          <span
            class="inline-block px-4 py-1.5 rounded-full text-xs font-semibold text-white shadow-sm"
            [style.background]="getColor(i)">
            Entrar →
          </span>
        </div>
      </div>
    </p-card>

  </div>

</div>
