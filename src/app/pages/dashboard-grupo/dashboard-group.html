<div class="flex min-h-screen bg-gray-50">

  <aside class="w-64 bg-white border-r hidden md:block">
  </aside>

  <main class="flex-1 p-6">

 <h2
  class="mb-4 p-4 rounded shadow-md font-bold text-xl"
  [style.background]="grupoActual?.color"
  style="color:white"
>
  Dashboard - {{ grupoActual?.name }}
</h2>

    <!-- BOTONES -->
    <div class="mb-8 flex gap-4 flex-wrap">

    <!-- Solo admins pueden ver Kanban -->
<p-button
  *ngIf="permsSvc.hasPermission('ticket:add')"
  label="Ver Tablero Kanban"
  icon="pi pi-th-large"
  variant="text"
  [raised]="true"
  severity="info"
  routerLink="/kanban"
  styleClass="w-56"
/>

<!-- Solo admins pueden ver Lista de Tickets -->
<p-button
  *ngIf="permsSvc.hasPermission('ticket:add')"
  label="Lista de Tickets"
  icon="pi pi-table"
  variant="text"
  [raised]="true"
  severity="info"
  routerLink="/tickets"
  styleClass="w-56"
/>

<!-- Solo admins pueden crear tickets -->
<p-button
  *ngIf="permsSvc.hasPermission('ticket:add')"
  label="Nuevo Ticket"
  icon="pi pi-plus"
  variant="text"
  [raised]="true"
  severity="success"
  styleClass="w-56"
  (click)="showDialog()"
/>

    </div>


    <!-- ESTADISTICAS -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">

      <p-card header="Total Tickets" styleClass="shadow-sm border-t-4 border-blue-500">
        <div class="text-4xl font-bold">{{ total }}</div>
      </p-card>

      <p-card header="Pendientes" styleClass="shadow-sm border-t-4 border-yellow-500">
        <div class="text-4xl font-bold text-yellow-600">{{ pendientes }}</div>
      </p-card>

      <p-card header="En Progreso" styleClass="shadow-sm border-t-4 border-indigo-500">
        <div class="text-4xl font-bold text-indigo-600">{{ progreso }}</div>
      </p-card>

      <p-card header="Hechos" styleClass="shadow-sm border-t-4 border-green-500">
        <div class="text-4xl font-bold text-green-600">{{ hechos }}</div>
      </p-card>

    </div>


    <!-- TICKETS RECIENTES -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <div class="lg:col-span-2">

        <p-card header="Tickets Recientes">

          <ul class="divide-y divide-gray-100">

            <li
              *ngFor="let ticket of ticketsRecientes"
              class="py-3 flex justify-between items-center"
            >

              <span class="font-medium">
                {{ ticket.titulo }}
              </span>

              <span
                [ngClass]="{
                  ' text-yellow-800': ticket.estado === 'Pendiente',
                  ' text-blue-800': ticket.estado === 'En progreso',
                  ' text-red-800': ticket.estado === 'Bloqueado'
                }"
                class="px-2 py-1 rounded text-xs font-semibold"
              >
                {{ ticket.estado }}
              </span>

            </li>

          </ul>

        </p-card>

      </div>


      <!-- ALERTAS -->
      <div>

        <p-card header="Alertas" styleClass="bg-red-50">

          <div class="flex items-center gap-3 text-red-700">

            <i class="pi pi-exclamation-triangle text-2xl"></i>

            <div>

              <div class="font-bold">
                {{ bloqueados }} Ticket bloqueado
              </div>

              <p class="text-sm text-red-600">
                Requiere atención inmediata
              </p>

            </div>

          </div>

        </p-card>

      </div>

    </div>

  </main>

</div>



<!-- DIALOG CREAR TICKET -->
<p-dialog
  header="Crear Nuevo Ticket"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '30rem' }"
>

  <div class="flex flex-col gap-4">

    <!-- TITULO -->
    <div>
      <label class="font-semibold">Título</label>
      <input pInputText [(ngModel)]="nuevoTicket.titulo" class="w-full" required/>
    </div>

    <!-- DESCRIPCION -->
    <div>
      <label class="font-semibold">Descripción</label>

      <p-textarea
        [(ngModel)]="nuevoTicket.descripcion"
        rows="4"
        class="w-full"
        autoResize="true">
      </p-textarea>
    </div>

    <!-- ESTADO -->
    <div>
      <label class="font-semibold">Estado</label>

      <p-select
        [options]="estados"
        [(ngModel)]="nuevoTicket.estado"
        optionLabel="label"
        optionValue="value"
        placeholder="Seleccionar estado"
        appendTo="body"
        class="w-full">
      </p-select>
    </div>

    <!-- PRIORIDAD -->
    <div>
      <label class="font-semibold">Prioridad</label>

      <p-select
        [options]="prioridades"
        [(ngModel)]="nuevoTicket.prioridad"
        optionLabel="label"
        optionValue="value"
        placeholder="Seleccionar prioridad"
        appendTo="body"
        class="w-full">
      </p-select>
    </div>

<div>
  <label class="font-semibold text-primary block mb-2">
    Asignar usuario por email
  </label>

  <div class="flex items-center gap-2">

    <!-- ICONO SEPARADO -->
    <i class="pi pi-envelope text-gray-600"></i>

    <!-- INPUT -->
    <input
      pInputText
      class="flex-1"
      placeholder="correo@ejemplo.com"
      [(ngModel)]="nuevoEmail"
      (keyup.enter)="agregarUsuario()" />

    <!-- BOTÓN -->
    <p-button
      icon="pi pi-plus"
      severity="success"
      (click)="agregarUsuario()">
    </p-button>

  </div>
</div>

    <!-- USUARIOS AGREGADOS -->
    <div class="flex flex-wrap gap-2 mt-2">

      <span
        *ngFor="let user of usuariosAsignados"
        class="bg-blue-100 text-blue-800 px-3 py-1 rounded text-sm flex items-center gap-2"
      >

        <i class="pi pi-user"></i>
        {{ user }}

        <i
          class="pi pi-times cursor-pointer hover:text-red-600"
          (click)="eliminarUsuario(user)">
        </i>

      </span>

    </div>

  </div>


  <!-- FOOTER -->
 <ng-template pTemplate="footer">
  <div class="flex justify-end gap-2">

    <p-button
      label="Cancelar"
      icon="pi pi-times"
      severity="secondary"
      (click)="visible = false">
    </p-button>

    <p-button
      label="Crear Ticket"
      icon="pi pi-check"
      (click)="crearTicket()">
    </p-button>

  </div>
</ng-template>
</p-dialog>
