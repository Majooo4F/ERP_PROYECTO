<p-toast></p-toast>

<div class="p-6 bg-gray-50 min-h-screen">
  <h2 class="text-3xl font-bold mb-4 text-gray-800 border-b pb-2">
    Lista de Tickets
  </h2>

  <!-- FILTROS RÁPIDOS -->
  <div class="mb-4 flex gap-2 flex-wrap">
    <button *ngFor="let f of filtros"
      pButton type="button"
      [label]="f.label"
      (click)="aplicarFiltroRapido(f.value)"
      [severity]="filtroRapido === f.value ? 'primary' : 'secondary'"
      class="text-white">
    </button>
  </div>

  <!-- BÚSQUEDA GLOBAL -->
  <div class="mb-4">
    <input pInputText type="text" placeholder="Buscar ticket..."
      (input)="onFilter($event)"
      class="w-full md:w-80"/>
  </div>

  <!-- LOADING -->
  <div *ngIf="loading()" class="flex justify-center py-10">
    <i class="pi pi-spin pi-spinner text-4xl text-blue-500"></i>
  </div>

  <!-- TABLA -->
  <p-table *ngIf="!loading()"
    #tabla
    [value]="ticketsFiltrados"
    [paginator]="true"
    [rows]="10"
    [globalFilterFields]="['id','titulo','descripcion','estado','prioridad']"
    styleClass="p-datatable-gridlines shadow-md">

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="id">ID <p-sortIcon field="id"/></th>
        <th pSortableColumn="titulo">Título <p-sortIcon field="titulo"/></th>
        <th pSortableColumn="descripcion">Descripción <p-sortIcon field="descripcion"/></th>
        <th pSortableColumn="estado">Estado <p-sortIcon field="estado"/></th>
        <th pSortableColumn="prioridad">Prioridad <p-sortIcon field="prioridad"/></th>
        <th>Acción</th>
      </tr>
      <tr>
        <th></th>
        <th><input pInputText placeholder="Buscar..." (input)="onFilter($event, 'titulo')"/></th>
        <th><input pInputText placeholder="Buscar..." (input)="onFilter($event, 'descripcion')"/></th>
        <th>
          <p-select [options]="estados" optionLabel="label" optionValue="value"
            placeholder="Estado" (onChange)="tabla.filter($event.value,'estado','equals')"/>
        </th>
        <th>
          <p-select [options]="prioridades" optionLabel="label" optionValue="value"
            placeholder="Prioridad" (onChange)="tabla.filter($event.value,'prioridad','equals')"/>
        </th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-ticket>
      <tr>
        <td>{{ ticket.id }}</td>
        <td class="font-medium">{{ ticket.titulo }}</td>
        <td class="text-gray-600 text-sm max-w-xs truncate">{{ ticket.descripcion || '—' }}</td>
        <td>
          <p-tag [value]="getEstadoLabel(ticket.estado)"
                 [severity]="getEstadoSeverity(ticket.estado)"/>
        </td>
        <td>
          <p-tag [value]="ticket.prioridad"
                 [severity]="getPrioridadSeverity(ticket.prioridad)"/>
        </td>
        <td class="flex gap-2">
          <p-button icon="pi pi-pencil" severity="warn" [rounded]="true" [text]="true"
            (click)="editarTicket(ticket)"/>
          <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [text]="true"
            (click)="eliminarTicket(ticket)"/>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="text-center py-8 text-gray-400">
          <i class="pi pi-inbox text-4xl block mb-2"></i>
          No hay tickets
        </td>
      </tr>
    </ng-template>

  </p-table>
</div>

<!-- DIALOG EDITAR -->
<p-dialog header="Editar Ticket" [(visible)]="displayDialog"
          [modal]="true" [style]="{ width: '32rem' }">

  <form [formGroup]="ticketForm" class="flex flex-col gap-4 pt-2">

    <div class="flex flex-col gap-1">
      <label class="font-semibold text-sm">Título</label>
      <input pInputText formControlName="titulo" class="w-full"/>
    </div>

    <div class="flex flex-col gap-1">
      <label class="font-semibold text-sm">Descripción</label>
      <textarea formControlName="descripcion" rows="3"
        class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-200 resize-none">
      </textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-1">
        <label class="font-semibold text-sm">Estado</label>
        <p-select [options]="estados" formControlName="estado"
                  optionLabel="label" optionValue="value"
                  appendTo="body" class="w-full"/>
      </div>
      <div class="flex flex-col gap-1">
        <label class="font-semibold text-sm">Prioridad</label>
        <p-select [options]="prioridades" formControlName="prioridad"
                  optionLabel="label" optionValue="value"
                  appendTo="body" class="w-full"/>
      </div>
    </div>

    <!-- ASIGNAR A USUARIO -->
    <div class="flex flex-col gap-1">
      <label class="font-semibold text-sm">Asignar a</label>
      <p-select [options]="miembrosGrupo"
                formControlName="asignado_id"
                optionLabel="label"
                optionValue="value"
                placeholder="Sin asignar"
                [showClear]="true"
                appendTo="body"
                class="w-full"/>
    </div>

  </form>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button label="Cancelar" severity="secondary"
                (click)="displayDialog = false"/>
      <p-button label="Guardar" icon="pi pi-check"
                [loading]="guardando()" (click)="guardarCambios()"/>
    </div>
  </ng-template>

</p-dialog>
