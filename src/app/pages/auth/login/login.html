<p-toast></p-toast>

<div class="flex min-h-screen items-center justify-center bg-slate-100 p-6">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-2xl border border-gray-100">
    
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-black">Bienvenido</h1>
      <p class="text-gray-500 mt-2">Ingresa a tu cuenta</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-gray-700">Correo Electrónico</label>
        <input type="email" 
               formControlName="email"
               placeholder="correo@ejemplo.com"
               class="w-full rounded-lg border border-gray-300 p-3 shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all text-black"
               [class.border-red-500]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
               class="text-red-500 text-xs">
          Ingresa un correo válido
        </small>
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-gray-700">Contraseña</label>
        <input type="password" 
               formControlName="password"
               placeholder="Password123!"
               class="w-full rounded-lg border border-gray-300 p-3 shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all text-black"
               [class.border-red-500]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
               class="text-red-500 text-xs">
          La contraseña es obligatoria
        </small>
      </div>

      <button type="submit"
              [disabled]="loginForm.invalid || loading"
              class="w-full rounded-lg bg-blue-600 py-3.5 font-bold text-white shadow-lg hover:bg-blue-700 active:scale-[0.98] transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <i *ngIf="loading" class="pi pi-spin pi-spinner"></i>
        {{ loading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>

      <div class="text-center mt-6">
        <span class="text-gray-600 text-sm">¿No tienes cuenta?</span>
        <a routerLink="/register"
           class="ml-2 text-blue-600 font-semibold hover:underline cursor-pointer transition-colors">
          Regístrate aquí
        </a>
      </div>

    </form>
  </div>
</div>
