<div class="card">
  <div class="flex justify-between items-center mb-4">
    <div>
      <h2 class="text-xl font-bold text-black">Gestión Global de Usuarios</h2>
      <span class="text-sm text-black">Panel de Control para SuperAdmin</span>
    </div>
    <p-button label="Nuevo Usuario" icon="pi pi-user-plus" severity="info" (click)="openNew()"></p-button>
  </div>

  <div class="flex justify-end mb-3">
    <span class="p-input-icon-left">
      <i class="pi pi-search"></i>
      <input pInputText type="text" placeholder="Buscar usuario..." class="w-64"
        (input)="dt.filterGlobal($event.target.value, 'contains')" />
    </span>
  </div>

  <p-table #dt [value]="users" [paginator]="true" [rows]="5"
  [globalFilterFields]="['name','email','permissionsText']"
    responsiveLayout="scroll"
    [tableStyle]="{ 'min-width': '60rem' }">

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name">Nombre <p-sortIcon field="name"></p-sortIcon></th>
        <th pSortableColumn="email">Email <p-sortIcon field="email"></p-sortIcon></th>
        <th>Permisos</th>
        <th style="width:150px">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-user let-i="rowIndex">
      <tr>
        <td class="font-semibold">{{ user.name }}</td>
        <td>{{ user.email }}</td>

        <!-- 🔥 PERMISOS -->
        <td>
          <div class="flex gap-2 flex-wrap">
            <span *ngFor="let perm of user.permissions"
              class="px-3 py-1 border-round text-sm text-white bg-blue-500">
              {{ perm ? perm.replace(/:/g,' - ') : '' }}
            </span>
          </div>
        </td>

        <td>
          <div class="flex gap-2">
            <p-button icon="pi pi-pencil" severity="info" [rounded]="true" [outlined]="true"
              (click)="editUser(user,i)">
            </p-button>

            <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
              (click)="deleteUser(i)">
            </p-button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- 🔥 DIALOG -->
  <p-dialog header="Usuario" [modal]="true" [(visible)]="visible"
    [style]="{ width: '30rem' }"
    [draggable]="false" [resizable]="false">

    <span class="block mb-4 text-surface-500">Información del usuario</span>

    <!-- NOMBRE -->
    <div class="flex items-center gap-4 mb-4">
      <label class="font-semibold w-24">Nombre</label>
      <input pInputText [(ngModel)]="user.name" class="flex-auto">
    </div>

    <!-- EMAIL -->
    <div class="flex items-center gap-4 mb-4">
      <label class="font-semibold w-24">Email</label>
      <input pInputText [(ngModel)]="user.email" class="flex-auto">
    </div>

    <!-- 🔥 BOTONES PRO -->
    <div class="flex justify-end gap-2 mb-2">
      <p-button label="Todos (Admin)" severity="info" (click)="selectAll()"></p-button>
      <p-button label="Limpiar" severity="secondary" (click)="clearAll()"></p-button>
    </div>

    <!-- 🔥 MULTISELECT -->
    <div class="flex items-center gap-4 mb-6">
      <label class="font-semibold w-24">Permisos</label>

      <p-multiSelect
        [options]="permissionsList"
        [(ngModel)]="user.permissions"
        optionLabel="label"
        optionValue="value"
        display="chip"
        filter="true"
        [maxSelectedLabels]="3"
        selectedItemsLabel="{0} permisos seleccionados"
        appendTo="body"
        placeholder="Selecciona permisos"
        class="flex-auto">
      </p-multiSelect>

    </div>

    <!-- BOTONES -->
    <div class="flex justify-end gap-2">
      <p-button label="Cancelar" severity="secondary" (click)="visible=false"></p-button>
      <p-button label="Guardar" severity="success" (click)="saveUser()"></p-button>
    </div>

  </p-dialog>
</div>
