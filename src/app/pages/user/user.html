<p-toast></p-toast>

<div class="flex min-h-screen items-center justify-center bg-slate-100 p-6 py-12">
  <div class="w-full max-w-4xl rounded-2xl bg-white p-8 shadow-2xl border border-gray-100">

    <h1 class="text-3xl font-bold text-black text-center mb-8">Mi Perfil</h1>

    <!-- FORMULARIO -->
    <form [formGroup]="userForm" (ngSubmit)="onSave()"
          class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">

      <div class="flex flex-col gap-1">
        <label class="text-sm font-bold text-gray-700">Usuario</label>
        <input formControlName="usuario" type="text"
          [ngClass]="{'border-red-500': f['usuario'].touched && f['usuario'].invalid}"
          class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-200 text-black bg-white disabled:bg-gray-50">
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-bold text-gray-700">Nombre Completo</label>
        <input formControlName="nombreCompleto" type="text"
          [ngClass]="{'border-red-500': f['nombreCompleto'].touched && f['nombreCompleto'].invalid}"
          class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-200 text-black bg-white disabled:bg-gray-50">
      </div>

      <div class="flex flex-col gap-1 md:col-span-2">
        <label class="text-sm font-bold text-gray-700">Email</label>
        <input formControlName="email" type="email"
          [ngClass]="{'border-red-500': f['email'].touched && f['email'].invalid}"
          class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-200 text-black bg-white disabled:bg-gray-50">
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-bold text-gray-700">Teléfono</label>
        <input formControlName="telefono" type="text" maxlength="10"
          [ngClass]="{'border-red-500': f['telefono'].touched && f['telefono'].invalid}"
          class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-200 text-black bg-white disabled:bg-gray-50">
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-bold text-gray-700">Dirección</label>
        <input formControlName="direccion" type="text"
          [ngClass]="{'border-red-500': f['direccion'].touched && f['direccion'].invalid}"
          class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-200 text-black bg-white disabled:bg-gray-50">
      </div>

      <div class="flex flex-col gap-1 relative">
        <label class="text-sm font-bold text-gray-700">Nueva Contraseña</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
            class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-200 text-black bg-white disabled:bg-gray-50 w-full pr-12"
            placeholder="Dejar vacío para no cambiar">
          <button type="button" (click)="togglePassword()"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500">
            <i [class]="showPassword ? 'pi pi-eye' : 'pi pi-eye-slash'"></i>
          </button>
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-bold text-gray-700">Confirmar Contraseña</label>
        <input [type]="showPassword ? 'text' : 'password'" formControlName="confirmPassword"
          [ngClass]="{'border-red-500': userForm.errors?.['notMatching'] && f['confirmPassword'].touched}"
          class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-200 text-black bg-white disabled:bg-gray-50"
          placeholder="Repite la contraseña">
        <small *ngIf="userForm.errors?.['notMatching'] && f['confirmPassword'].touched"
               class="text-red-600 text-xs">Las contraseñas no coinciden.</small>
      </div>

      <div class="md:col-span-2 mt-4 flex gap-4 justify-center">
        <p-button *ngIf="!editMode"
                  label="Editar Perfil"
                  icon="pi pi-pencil"
                  severity="secondary"
                  (onClick)="enableEdit()"/>

        <p-button *ngIf="editMode"
                  label="Cancelar"
                  icon="pi pi-times"
                  severity="secondary"
                  type="button"
                  (onClick)="editMode = false; userForm.disable()"/>

        <p-button *ngIf="editMode"
                  label="Guardar Cambios"
                  icon="pi pi-check"
                  severity="success"
                  type="submit"
                  [loading]="guardando()"
                  [disabled]="userForm.invalid"/>
      </div>

    </form>

    <!-- RESUMEN DE TICKETS -->
    <!-- RESUMEN DE TICKETS -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-10">
  <p-card header="Pendientes">
    <h2 class="text-2xl font-bold text-yellow-600 text-center">{{ pendientes() }}</h2>
  </p-card>
  <p-card header="En Progreso">
    <h2 class="text-2xl font-bold text-blue-600 text-center">{{ enProgreso() }}</h2>
  </p-card>
  <p-card header="Hechos">
    <h2 class="text-2xl font-bold text-green-600 text-center">{{ hechos() }}</h2>
  </p-card>
</div>


    <!-- TABLA DE TICKETS -->
    <div class="mt-8">
      <p-card header="Mis Tickets">
       <p-table [value]="tickets()" responsiveLayout="scroll">
          <ng-template pTemplate="header">
            <tr>
              <th>ID</th>
              <th>Título</th>
              <th>Estado</th>
              <th>Prioridad</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-ticket>
            <tr>
              <td>{{ ticket.id }}</td>
              <td>{{ ticket.titulo }}</td>
              <td>
                <p-tag [value]="getEstadoLabel(ticket.estado)"
                       [severity]="getEstadoSeverity(ticket.estado)"/>
              </td>
              <td>
                <p-tag [value]="ticket.prioridad"
                       [severity]="getPrioridadSeverity(ticket.prioridad)"/>
              </td>
            </tr>
          </ng-template>
          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="4" class="text-center py-6 text-gray-400">
                <i class="pi pi-inbox text-3xl block mb-2"></i>
                No tienes tickets asignados
              </td>
            </tr>
          </ng-template>
        </p-table>
      </p-card>
    </div>

  </div>
</div>
