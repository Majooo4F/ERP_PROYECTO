<p-toast></p-toast>

<div class="flex min-h-screen items-center justify-center bg-slate-100 p-6 py-12">
  <div class="w-full max-w-2xl rounded-2xl bg-white p-8 shadow-2xl border border-gray-100">

    <h1 class="text-3xl font-bold text-black text-center mb-8">
      Perfil de Usuario
    </h1>

    <form [formGroup]="userForm" (ngSubmit)="onSave()" class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">

      <div class="flex flex-col gap-1">
        <label class="text-sm font-bold text-gray-700">Usuario</label>
        <input formControlName="usuario" type="text"
          [ngClass]="{'border-red-500': f['usuario'].touched && f['usuario'].invalid}"
          class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-200 text-black bg-white disabled:bg-gray-50">
        <small *ngIf="f['usuario'].touched && f['usuario'].errors?.['required']" class="text-red-500">
          El usuario es obligatorio
        </small>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-bold text-gray-700">Nombre Completo</label>
        <input formControlName="nombreCompleto" type="text"
          [ngClass]="{'border-red-500': f['nombreCompleto'].touched && f['nombreCompleto'].invalid}"
          class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-200 text-black bg-white disabled:bg-gray-50">
        <small *ngIf="f['nombreCompleto'].touched && f['nombreCompleto'].errors?.['required']" class="text-red-500">
          El nombre es obligatorio
        </small>
      </div>

      <div class="flex flex-col gap-1 md:col-span-2">
        <label class="text-sm font-bold text-gray-700">Email</label>
        <input formControlName="email" type="email"
          [ngClass]="{'border-red-500': f['email'].touched && f['email'].invalid}"
          class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-200 text-black bg-white disabled:bg-gray-50">
        <small *ngIf="f['email'].touched && f['email'].errors?.['required']" class="text-red-500">El email es obligatorio</small>
        <small *ngIf="f['email'].touched && f['email'].errors?.['email']" class="text-red-500">Formato de email inválido</small>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-bold text-gray-700">Teléfono</label>
        <input formControlName="telefono" type="text" maxlength="10"
          [ngClass]="{'border-red-500': f['telefono'].touched && f['telefono'].invalid}"
          class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-200 text-black bg-white disabled:bg-gray-50">
        <small *ngIf="f['telefono'].touched && f['telefono'].errors?.['pattern']" class="text-red-500">
          Debe contener exactamente 10 números
        </small>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-bold text-gray-700">Fecha de Nacimiento</label>
        <input formControlName="fechaNacimiento" type="date"
          [ngClass]="{'border-red-500': f['fechaNacimiento'].touched && f['fechaNacimiento'].invalid}"
          class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-200 text-black bg-white disabled:bg-gray-50">
        <small *ngIf="f['fechaNacimiento'].touched && f['fechaNacimiento'].errors?.['menorDeEdad']" class="text-red-500">
          Debes ser mayor de 18 años
        </small>
      </div>

      <div class="flex flex-col gap-1 relative">
        <label class="text-sm font-bold text-gray-700">Contraseña</label>
        <div class="password-wrapper relative">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
            [ngClass]="{'border-red-500': f['password'].touched && f['password'].invalid}"
            class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-200 text-black bg-white disabled:bg-gray-50 w-full pr-12">
          
          <button type="button" (click)="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 z-10">
            <i [class]="showPassword ? 'pi pi-eye' : 'pi pi-eye-slash'"></i>
          </button>
        </div>
        <small *ngIf="f['password'].touched && f['password'].errors?.['pattern']" class="text-red-500 text-xs mt-1 block">
          Mínimo 8 caracteres, 1 Mayúscula, 1 Número y 1 Carácter Especial
        </small>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-bold text-gray-700">Confirmar Contraseña</label>
        <input [type]="showPassword ? 'text' : 'password'" formControlName="confirmPassword"
          [ngClass]="{'border-red-500': f['confirmPassword'].touched && (f['confirmPassword'].invalid || userForm.errors?.['notMatching'])}"
          class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-200 text-black bg-white disabled:bg-gray-50">
        <small *ngIf="f['confirmPassword'].touched && userForm.errors?.['notMatching']" class="text-red-500">
          Las contraseñas no coinciden
        </small>
      </div>

      <div class="md:col-span-2 mt-8 flex gap-4 justify-center">
        <p-button *ngIf="!editMode" 
                  label="Editar Perfil" 
                  icon="pi pi-pencil" 
                  styleClass="p-button-outlined p-button-secondary" 
                  (onClick)="enableEdit()">
        </p-button>

        <p-button *ngIf="editMode" 
                  label="Guardar Cambios" 
                  icon="pi pi-check" 
                  severity="success" 
                  type="submit"
                  [disabled]="userForm.invalid">
        </p-button>
      </div>

    </form>
  </div>
</div>
